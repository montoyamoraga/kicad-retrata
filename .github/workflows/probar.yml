name: Probar kicad-retrata

# Corre la acción contra el proyecto mínimo de pruebas/, sin hacer commit, y
# revisa que genere las dos capturas y la tabla de BOM esperada.
on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar kicad-retrata
        uses: actions/checkout@v7

      - name: Correr kicad-retrata
        id: retrata
        uses: ./
        with:
          configuracion: pruebas/kicad-retrata.yml
          hacer-commit: "false"

      - name: Revisar resultado
        run: |
          set -eu
          test -s pruebas/docs/images/proyecto-minimo-esquematico.svg
          test -s pruebas/docs/images/proyecto-minimo-placa.svg
          grep -F "| R1, R2 | 2 | 10k |" pruebas/docs/proyecto-minimo.md
          grep -F "| R3 | 1 | 100k |" pruebas/docs/proyecto-minimo.md
          test "${{ steps.retrata.outputs.hubo-cambios }}" = "true"
